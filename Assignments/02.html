<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse Input Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #output {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Enter a String and Reverse It</h2>
    
    <!-- Input field where user types their text -->
    <input type="text" id="inputField" placeholder="Type something here..." />
    
    <!-- Button that will trigger the reversal of the input text -->
    <button id="reverseButton">Reverse</button>
    
    <!-- Element where the reversed string will be displayed -->
    <p id="output"></p>

    <script>
        // Get references to the elements
        const inputField = document.getElementById('inputField');
        const reverseButton = document.getElementById('reverseButton');
        const output = document.getElementById('output');

        // Add event listener to the button
        reverseButton.addEventListener('click', () => {
            // Get the value entered in the input field
            const inputValue = inputField.value;

            // Reverse the input value
            const reversedValue = inputValue.split('').reverse().join('');

            // Display the reversed value in the output paragraph
            output.innerText = `Reversed Input: ${reversedValue}`;
        });
    </script>

</body>
</html>
