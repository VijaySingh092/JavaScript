<!-- let's say we have a group of buttons, and we want to change the color of a button when it's clicked. Instead of attaching a separate event listener to each button, we can attach one event listener to the parent element that contains all the buttons. This is especially useful if we have a large number of buttons or if the buttons are dynamically added to the DOM. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="parent">
        <button>button1</button>
        <button>button2</button>
        <button>button3</button>
        <button>button4</button>
    </div>
    <script src="./01.js"></script>
</body>
</html>
