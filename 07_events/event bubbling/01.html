<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>bubbling event in javascript</h2>

    <div id="parent">
        <button>
            <h2>
                PARENT
            </h2>
        </button>
        <button id="child">
<p>CHILD</p>
        </button>
    </div>

    <script src="./01.js"></script>
</body>
</html>



<!-- rom above example we understand that in bubbling the innermost element’s event is handled first and then the outer: the <p> element’s click event is handled first, then the <div> element’s click event.

 -->
